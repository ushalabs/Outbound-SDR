[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "outbound-sdr-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "beautifulsoup4>=4.13,<5",
  "google-genai>=1,<3", "langchain-core>=0.3,<2", "pgvector>=0.3,<1",
  "python-multipart>=0.0.20", "email-validator>=2,<3", "certifi>=2025"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real external services, explicitly invoked"]

[tool.ruff]
line-length = 110
